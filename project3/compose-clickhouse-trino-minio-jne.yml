# -----------------------------------------------------------------------
# We don't support docker compose for production environments.
# If you choose to use this type of deployment make sure to
# create you own docker environment file (docker/.env) with your own
# unique random secure passwords and SECRET_KEY.
#
# For verbose logging during development:
# - Set SUPERSET_LOG_LEVEL=debug in docker/.env-local for detailed Superset logs
# -----------------------------------------------------------------------
x-superset-image: &superset-image apachesuperset.docker.scarf.sh/apache/superset:${TAG:-latest-dev}
x-superset-volumes:
  &superset-volumes # /app/pythonpath_docker will be appended to the PYTHONPATH in the final container
  - ./docker:/app/docker # optionally comment me out if having bash/r error - will need to manually install clickhouse_connect on Superset container
  - ./superset-core:/app/superset-core # optionally comment me out if having bash/r error - will need to manually install clickhouse_connect on Superset container
  - superset_home:/app/superset_home

services:
  # Redis cache
  redis:
    image: redis:7
    container_name: superset_cache
    volumes:
      - redis:/data

  # Postgres metadata DB
  db:
    image: postgres:16
    container_name: superset_db
    env_file:
      - docker/.env
      - docker/.env-local
    volumes:
      - db_home:/var/lib/postgresql/data
      - ./docker/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d

  # Superset web/app
  superset:
    image: apache/superset:latest
    container_name: superset_app
    command: ["/app/docker/docker-bootstrap.sh", "app-gunicorn"]
    env_file:
      - docker/.env
      - docker/.env-local
    user: "root"
    ports:
      - 8088:8088
    depends_on:
      superset-init:
        condition: service_completed_successfully
    volumes:
      - ./docker:/app/docker
      - ./superset-core:/app/superset-core
      - superset_home:/app/superset_home

  # Superset init
  superset-init:
    image: apache/superset:latest
    container_name: superset_init
    command: ["/app/docker/docker-init.sh"]
    env_file:
      - docker/.env
      - docker/.env-local
    user: "root"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ./docker:/app/docker
      - ./superset-core:/app/superset-core
      - superset_home:/app/superset_home

  # ClickHouse analytics DB
  clickhouse-server-viz:
    image: clickhouse/clickhouse-server
    container_name: clickhouse-server-viz
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin_password
    ports:
      - "8123:8123"  # HTTP
      - "9000:9000"  # Native client
    volumes:
      - clickhouse-viz-data:/var/lib/clickhouse/
      - ./sql:/sql
      - ./sample_data:/var/lib/clickhouse/user_files
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # Trino query engine for Iceberg
  trino:
    image: trinodb/trino:latest
    container_name: trino
    ports:
      - "8081:8080"  # Trino Web UI
    volumes:
      - ./trino/catalog:/etc/trino/catalog
      - ./trino/data:/data
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx2G -Xms512M"

  # MinIO S3 object storage for Iceberg
  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9001:9000"  # MinIO API + Web UI
    command: server /data
    volumes:
      - minio-data:/data

volumes:
  superset_home:
    external: false
  db_home:
    external: false
  redis:
    external: false
  clickhouse-viz-data:
    external: false
  minio-data:
    external: false
